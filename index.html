      <main id="main-content">
        <h1>Convierte tu red indirecta en un canal de ventas activo y medible</h1>
        <p>Redescomerciales.ai ayuda a empresas B2B a activar y gestionar su red comercial indirecta. Combinamos diagnóstico, seguimiento, metodología y tecnología para generar oportunidades con visibilidad del pipeline.</p>
        <section>
          <h2>¿Qué es Redescomerciales.ai?</h2>
          <p>Somos un sistema integral para CEOs y directores comerciales que quieren convertir partners, prescriptores y colaboradores en un canal de ventas activo, con seguimiento del pipeline indirecto.</p>
          <p>No somos una agencia de leads ni un software aislado: unimos estrategia, tecnología y operación para activar la red y mantenerla en movimiento.</p>
        </section>
        <section>
          <h2>Cómo activamos tu red comercial</h2>
          <p>Diagnóstico de la red actual, diseño del modelo de activación, implementación tecnológica y operación continua con seguimiento de oportunidades.</p>
          <p>El objetivo es pasar de una red pasiva —contactos dormidos sin visibilidad— a un canal indirecto medible, con indicadores de activación y pipeline.</p>
        </section>
        <section>
          <h2>Sectores y perfiles con los que trabajamos</h2>
          <p>Empresas B2B con ciclo comercial estructurado: SaaS, consultoría, servicios profesionales, fondos de inversión y scale-ups.</p>
          <p>Si tienes partners o potencial de red comercial y necesitas visibilidad y ejecución sistemática, podemos valorar un diagnóstico inicial sin compromiso.</p>
        </section>
        <section>
          <h2>Preguntas frecuentes</h2>
          <dl>
            <dt>¿Necesito tener ya una red?</dt>
            <dd>No es imprescindible. Muchas empresas tienen contactos infrautilizados y otras empiezan desde cero. En ambos casos diseñamos la estructura, los incentivos y el sistema de seguimiento.</dd>
            <dt>¿Cuánto tarda en verse resultados?</dt>
            <dd>Los primeros indicadores de activación suelen aparecer en semanas. El impacto comercial se consolida en mesos, según el tamaño de la red y el sector.</dd>
            <dt>¿Qué tipo de empresas encajan?</dt>
            <dd>Empresas B2B con ciclo comercial estructurado: SaaS, consultoría, servicios profesionales, fondos de inversión y scale-ups.</dd>
            <dt>¿Por qué no basta con nuestro CRM o las herramientas actuales?</dt>
            <dd>Un CRM almacena información, pero no activa ni opera la red. Añadimos el modelo de activación, el seguimiento sistemático y la visibilidad del pipeline indirecto que normalmente no cubren tus herramientas.</dd>
            <dt>¿Cómo puedo solicitar un diagnóstico?</dt>
            <dd>Desde la página de contacto, cuéntanos tu situación. Respondemos en 24 h laborables, revisamos tu red y, si encaja, agendamos una sesión de diagnóstico.</dd>
          </dl>
        </section>
