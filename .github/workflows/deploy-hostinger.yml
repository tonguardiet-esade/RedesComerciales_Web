name: Deploy Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar web
        env:
          VITE_SITE_URL: https://redescomerciales.pro
          VITE_SALES_URL: https://sales.redescomerciales.pro
          VITE_PLATAFORMA_URL: https://plataforma.redescomerciales.pro
        run: npm run build

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hostinger_key
          chmod 600 ~/.ssh/hostinger_key
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts

      - name: Preparar subida
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh -i ~/.ssh/hostinger_key -p "$PORT" "$USER@$HOST" \
          'rm -rf ~/domains/redescomerciales.pro/deploy_temp && mkdir -p ~/domains/redescomerciales.pro/deploy_temp'

      - name: Subir web compilada
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          scp -i ~/.ssh/hostinger_key -P "$PORT" -r dist/. \
          "$USER@$HOST:/home/$USER/domains/redescomerciales.pro/deploy_temp/"

      - name: Publicar web
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          USER: ${{ secrets.HOSTINGER_USER }}
        run: |
          ssh -i ~/.ssh/hostinger_key -p "$PORT" "$USER@$HOST" \
          'find ~/domains/redescomerciales.pro/public_html -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} + &&
          cp -a ~/domains/redescomerciales.pro/deploy_temp/. ~/domains/redescomerciales.pro/public_html/ &&
          rm -rf ~/domains/redescomerciales.pro/deploy_temp'
